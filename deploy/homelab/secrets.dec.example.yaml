# 1. Copy to secrets.dec.yaml (gitignored in the homelab repo via *.dec.yaml) and fill in.
# 2. From the homelab repo root (direnv provides sops + the age key):
#      sops --encrypt gitops/workloads/miss-pauling/secrets.dec.yaml > gitops/workloads/miss-pauling/secrets.sops.yaml
# 3. Commit only secrets.sops.yaml. KSOPS decrypts it in the Argo CD repo-server.
apiVersion: v1
kind: Secret
metadata:
  name: miss-pauling-secrets
type: Opaque
stringData:
  MISS_PAULING_API_SECRET_KEY: "change-me-long-random-string"
  DISCORD_CLIENT_SECRET: ""
  DISCORD_TOKEN: ""
  STEAM_API_KEY: ""
  TF2_RCON_PASSWORD_PUGA: ""
  TF2_RCON_PASSWORD_PUGB: ""
